name: Check

# Vérifie le code serveur partagé (server/) : types, tests avec couverture, format, SonarCloud
# (projet jerem-gt_ctrl-shared, secret SONAR_TOKEN). Le workflow réutilisable
# app.yml, lui, se teste depuis un projet (voir CLAUDE.md).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: 🧪 Types, tests & format
    runs-on: ubuntu-latest
    container: node:26.13.0-alpine
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache npm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # better-sqlite3 embarque ses binaires (prebuilds/) : aucun script d'installation nécessaire
      - name: Install deps
        run: npm ci --ignore-scripts

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm run test:coverage

      - name: Format
        run: npm run format:check

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sonar-assets
          path: coverage/lcov.info

  sonar:
    name: 🛡️ SonarCloud Analysis
    needs: [check]
    # Comme dans app.yml : le plan SonarCloud ne couvre que main et les PR.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sonar-assets
          path: coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # Tag vX.Y.Z publié à chaque push sur main qui le justifie (.releaserc.json) : feat → mineure,
  # fix et chore(deps) → patch, BREAKING CHANGE → majeure ; Renovate en propose ensuite la
  # montée dans chaque projet.
  release:
    name: 🚀 Semantic Release
    needs: [check, sonar]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v8.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
